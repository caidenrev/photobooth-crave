<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1850" width="600" height="1850">
  <!-- Canva Frame Template: Romantic LDR -->
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#18181B" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Top Canva Decorative Banner -->
  <rect x="24" y="24" width="552" height="70" rx="16" fill="#FFF1F2" stroke="#18181B" stroke-width="4" filter="url(#softShadow)"/>
  <text x="300" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="28" fill="#E11D48" text-anchor="middle" letter-spacing="2">
    CANVA SPECIAL EDITION
  </text>

  <!-- Cute Heart Stickers around top -->
  <path d="M 60 70 A 12 12 0 0 1 76 60 A 12 12 0 0 1 92 70 Q 76 95 76 95 Q 76 95 60 70 Z" fill="#FB7185" stroke="#18181B" stroke-width="3"/>
  <path d="M 508 70 A 12 12 0 0 1 524 60 A 12 12 0 0 1 540 70 Q 524 95 524 95 Q 524 95 508 70 Z" fill="#FB7185" stroke="#18181B" stroke-width="3"/>

  <!-- Romantic Sparkles & Decorative Stickers on Edges -->
  <g transform="translate(15, 520)">
    <circle cx="15" cy="15" r="12" fill="#FDE047" stroke="#18181B" stroke-width="3" filter="url(#softShadow)"/>
    <path d="M 15 5 L 18 12 L 25 15 L 18 18 L 15 25 L 12 18 L 5 15 L 12 12 Z" fill="#18181B"/>
  </g>

  <g transform="translate(550, 940)">
    <circle cx="15" cy="15" r="14" fill="#F472B6" stroke="#18181B" stroke-width="3" filter="url(#softShadow)"/>
    <text x="15" y="20" font-family="sans-serif" font-weight="900" font-size="16" fill="#18181B" text-anchor="middle">LDR</text>
  </g>

  <g transform="translate(15, 1380)">
    <rect x="0" y="0" width="36" height="24" rx="6" fill="#BAE6FD" stroke="#18181B" stroke-width="3" filter="url(#softShadow)"/>
    <text x="18" y="16" font-family="monospace" font-weight="bold" font-size="11" fill="#0369A1" text-anchor="middle">LOVE</text>
  </g>

  <!-- Bottom Canva Signature Badge -->
  <g transform="translate(40, 1750)">
    <rect x="0" y="0" width="520" height="60" rx="16" fill="#FFE4E6" stroke="#18181B" stroke-width="4" filter="url(#softShadow)"/>
    <text x="260" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#881337" text-anchor="middle" letter-spacing="1">
      SNAPBOND X CANVA LDR MOMENTS
    </text>
  </g>
</svg>
